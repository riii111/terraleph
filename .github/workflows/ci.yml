name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73
        with:
          tool: cargo-machete,ast-grep@0.42.1
      - run: ast-grep --version
      - run: ast-grep test --skip-snapshot-tests
      - run: ast-grep scan
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - run: cargo machete

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73
        with:
          tool: nextest,cargo-insta
      - run: cargo fetch --locked
      - name: Test and check snapshots
        env:
          NEXTEST_PROFILE: ci
        run: cargo insta test --test-runner nextest --disable-nextest-doctest --unreferenced=reject --all-targets --all-features
      - name: Build release binary
        run: cargo build --locked --release
      - run: cargo run --locked --release -- --version

  portability:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: '1.98.1'
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check Windows delegation
        if: runner.os == 'Windows'
        run: cargo test --locked --test delegation_windows
      - name: Check Windows display name escaping
        if: runner.os == 'Windows'
        run: cargo test --locked --lib app::execution::context::tests::windows_
      - run: cargo run --locked -- --version
      # Release tags require a green main CI run, so the optimized build is checked there instead of on every PR.
      - name: Build release binary
        if: github.event_name != 'pull_request'
        run: cargo build --locked --release
      - if: github.event_name != 'pull_request'
        run: cargo run --locked --release -- --version

  scenario-acceptance:
    name: Scenario acceptance (${{ matrix.tool }})
    strategy:
      fail-fast: false
      matrix:
        tool: [terraform, tofu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Terraform
        if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false
      - name: Install OpenTofu
        if: matrix.tool == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: '1.12.6'
          tofu_wrapper: false
      - run: cargo build --locked --bin terraleph
      - name: Verify single and repeated-resource plans
        run: python3 fixtures/basic/plan.py accept --tool '${{ matrix.tool }}'
      - name: Verify multi-environment CLI retry
        run: python3 fixtures/environments/acceptance.py --binary target/debug/terraleph --tool '${{ matrix.tool }}'
      - name: Verify Terraform-backed Rust integration tests
        if: matrix.tool == 'terraform'
        run: |
          cargo test --locked --lib reviews_the_basic_scenario_with_four_direct_matches_and_one_no_match -- --ignored
          cargo test --locked --lib gets_saved_plan_from_the_basic_terraform_scenario -- --ignored
          cargo test --locked --test cli single_demo_opens_the_tui_after_noninteractive_setup -- --ignored

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73
        with:
          tool: cargo-audit
      - run: cargo audit

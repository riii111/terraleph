name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing latest stable tag to backfill on crates.io only
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version-check:
    name: Check tag version
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate recovery request
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$RELEASE_TAG" == "$latest" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Compare tag with Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v${version}" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $version"
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == push && "$commit" != "$(git rev-parse "$GITHUB_SHA^{commit}")" ]]; then
            echo "::error::The tag no longer points to the triggering commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version-check
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: '1.100.0'
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="terraleph-${TARGET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "${archive}" terraleph
          shasum -a 256 "${archive}" > "${archive}.sha256"
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $archive = "terraleph-$env:TARGET.zip"
          Compress-Archive -Path "target/$env:TARGET/release/terraleph.exe" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          [System.IO.File]::WriteAllText((Join-Path $PWD "$archive.sha256"), "$hash  $archive`n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraleph-${{ matrix.target }}
          path: |
            terraleph-${{ matrix.target }}.${{ matrix.archive }}
            terraleph-${{ matrix.target }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  package-crate:
    name: Check crates.io package
    needs: version-check
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: '1.100.0'
      - run: cargo package --locked

  publish-crate:
    name: Publish to crates.io
    needs: [version-check, build, package-crate]
    if: >-
      ${{ !cancelled() && needs.version-check.result == 'success' &&
          needs.package-crate.result == 'success' &&
          (needs.build.result == 'success' ||
            (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check current distribution
        id: distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/verify-release.py github-and-tap "$RELEASE_TAG" "$RELEASE_COMMIT"
          fi
          status=$(python3 scripts/verify-release.py crate-status "$RELEASE_TAG" "$RELEASE_COMMIT")
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.distribution.outputs.status == 'missing'
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        if: steps.distribution.outputs.status == 'missing'
        with:
          toolchain: '1.100.0'
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-auth
        if: steps.distribution.outputs.status == 'missing'
      - name: Publish the tagged crate
        if: steps.distribution.outputs.status == 'missing'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked --no-verify

  release:
    name: Publish release
    needs: [build, publish-crate]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.build.result == 'success' &&
          (needs.publish-crate.result == 'success' ||
            (contains(github.ref_name, '-') && needs.publish-crate.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  homebrew:
    name: Update Homebrew tap
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: riii111/homebrew-terraleph
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Write formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' tap/Formula/terraleph.rb 2>/dev/null || true)
          if [ -n "${current}" ] && [ "$(printf '%s\n%s\n' "${current}" "${version}" | sort -V | tail -n 1)" != "${version}" ]; then
            echo "Formula already has ${current}; skipping older ${version}"
            exit 0
          fi
          base="https://github.com/riii111/terraleph/releases/download/${TAG}"
          sha() { cut -d ' ' -f 1 "artifacts/terraleph-$1.tar.gz.sha256"; }
          mkdir -p tap/Formula
          cat > tap/Formula/terraleph.rb <<EOF
          class Terraleph < Formula
            desc "Review and apply Terraform or OpenTofu plans in your terminal"
            homepage "https://github.com/riii111/terraleph"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/terraleph-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "${base}/terraleph-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/terraleph-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "${base}/terraleph-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "terraleph"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/terraleph --version")
            end
          end
          EOF
      - name: Push formula
        env:
          TAG: ${{ github.ref_name }}
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/terraleph.rb
          if git diff --cached --quiet; then
            echo "Formula is already up to date"
            exit 0
          fi
          git commit -m "terraleph ${TAG#v}"
          git push

  verify-release:
    name: Verify release distribution
    needs: [version-check, publish-crate, release, homebrew]
    if: ${{ !cancelled() && !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful distribution jobs
        env:
          VERSION_CHECK: ${{ needs.version-check.result }}
          CRATE_PUBLISH: ${{ needs.publish-crate.result }}
          GITHUB_RELEASE: ${{ needs.release.result }}
          HOMEBREW: ${{ needs.homebrew.result }}
        run: |
          if [[ "$VERSION_CHECK" != success || "$CRATE_PUBLISH" != success ]]; then
            echo "::error::Version check or crates.io publication did not succeed"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_RELEASE" != success || "$HOMEBREW" != success ) ]]; then
            echo "::error::GitHub publication or Homebrew update did not succeed"
            exit 1
          fi
      - name: Verify GitHub, Homebrew, and crates.io
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.version-check.outputs.commit }}
        run: |
          for attempt in {1..6}; do
            if python3 scripts/verify-release.py verify "$RELEASE_TAG" "$RELEASE_COMMIT"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1

[package]
name = "terraleph"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Review and apply Terraform or OpenTofu plans in your terminal"
license = "MIT"
repository = "https://github.com/riii111/terraleph"
keywords = ["terraform", "opentofu", "tui", "iac", "infrastructure"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[features]
test-support = []

[dependencies]
hcl = { package = "hcl-rs", version = "0.19.8" }
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
insta = "1"
rstest = "0.27"
tempfile = "3.27"

[lints.rust]
redundant_imports = "deny"
unfulfilled_lint_expectations = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Keep crate-private visibility explicit across private layer modules.
redundant_pub_crate = "allow"
absolute_paths = "warn"
dbg_macro = "deny"
exit = "deny"
get_unwrap = "deny"
mem_forget = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
